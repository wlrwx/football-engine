name: Tests

# 2026-08-14 新增：回归测试（历史静默 bug 锁定）。
# 触发条件：engine/tests/scripts 有改动时跑 pytest。
# 覆盖：f键解析、水位信号方向、北京时间日期、比分校准、让球 EV、联赛 verdict。

on:
  push:
    paths:
      - 'engine/**'
      # 2026-10-12：三道锁（白名单/反事实/CODEOWNERS）落在 evolution/ 下，
      # 不挂触发路径的话改了它们 CI 根本不跑，锁等于没有回归保护。
      - 'evolution/**'
      - '.github/CODEOWNERS'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
  pull_request:
    paths:
      - 'engine/**'
      - 'evolution/**'
      - '.github/CODEOWNERS'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  # 2026-10-12 修复：原来 group 是全局的 `sporttery-tests` + cancel-in-progress，
  # 导致**并行的多个 PR 互相取消对方的 CI**：一次开 4 个 PR，只有最后一个的
  # run 是 completed，其余全被标记成 failure/cancelled，看起来像挂了。
  # （实测 PR#22 的 push run 与 pull_request run 两次都被取消。）
  # 按 PR 号（回退到 ref）分组后，各 PR 独立，重复提交同一 PR 才互相取消。
  group: sporttery-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt --quiet
          # 测试只依赖标准库 + engine 纯函数模块；装全量依赖以防未来测试引入
          pip install -r requirements.txt --quiet || echo "⚠ 全量依赖安装失败（测试继续，纯函数测试不需要）"

      - name: Install lint tool
        run: pip install ruff --quiet

      - name: Ruff (F-level regressions)
        # 2026-10-13：补 `evolution`。本 PR 把 evolution/** 挂上了触发路径
        # （不挂的话改了三道锁 CI 根本不跑），但 lint 步骤没跟着扩 ——
        # 实测该目录有 16 处 F 级告警（未用变量/未用 import）在 CI 里
        # 完全不可见。触发路径和 lint 范围必须同步，否则"跑了"不等于"查了"。
        # pytest 仍只跑 tests/：evolution/tests/ 自己跑（本 workflow 只保回归）。
        run: ruff check --select F engine scripts tests evolution

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Repo size guard
        # 2026-10-23（评审 P2#20）：防止大体量数据（parsed.jsonl 26MB 这类）
        # 再次静默入 git。历史遗留文件在白名单里豁免。
        run: python scripts/check_repo_size.py
