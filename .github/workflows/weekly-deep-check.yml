# 周一深度体检上云（北京时间周一 03:30 = UTC 周日 19:30）。
# 与 Mac 端旧 ZCode cron 的差别：代理自愈/凭据都不需要——CI 原生直连。
# 产出：六份评测 JSON 回仓 + 工作流摘要页呈现评委席/挑战/CLV 全量简报。
name: Weekly Deep Check
on:
  schedule:
    - cron: '30 19 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deep-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt --quiet
      - name: 升级判定（配对 vs 基线/市场）
        run: python scripts/upgrade_tracker.py
      - name: EV 分桶校准
        run: python scripts/edge_calibration.py
      - name: 挑战预登记复盘（含策略建议）
        # 不再 `|| true`：此前它吞掉的正是 load_state() 读 _vault 快照的
        # FileNotFoundError（_vault/ 被 gitignore），云端整个复盘从未真跑过。
        # 现改读已入库的 data/state/challenge_state.json，失败就该让 CI 红。
        run: python scripts/challenge_review.py
      - name: 下注级 CLV
        run: python -m engine.review.clv --days 30
      - name: 评委席点检
        run: python scripts/eval_plane.py
      - name: 数据完整性自检
        run: python -m engine.selfcheck --fail-on-critical || echo "::warning::selfcheck 报 critical"
      - name: 汇总进摘要（vs 上次周检）
        run: |
          {
            echo "## 周度趋势"
            echo
            python scripts/weekly_digest.py --write
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 回仓
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/wlrwx/football-engine.git"
          # 逐个 add：单个文件缺失时不让整条 add 原子失败（此前 2>/dev/null || true
          # 会把「什么都没暂存」伪装成成功）。
          for f in data/state/upgrade_tracker.json data/state/edge_calibration.json \
                   data/state/clv_report.json data/state/eval_registry.json \
                   data/state/challenge_review.json data/state/challenge_policy.json \
                   data/state/system_health.json data/state/weekly_digest.jsonl; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          # 2026-10-23：原来 `git pull --rebase || git rebase --abort; git commit; git push`
          # 在 rebase 失败后**照样往下走**，等于把冲突静默吞掉再推一个分叉分支。
          # 现在 rebase 失败即中止（set -e 语义），冲突可见、数据不被静默覆盖。
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          # 2026-10-28：pull --rebase 要求工作区干净；CLV/selfcheck 等步骤还会写
          # 别的 data/state 文件（不在白名单），10-25 实测因此报
          #   cannot pull with rebase: You have unstaged changes → exit 128
          # 周报永远推不出去。用 --autostash 收这些生成物；autostash 冲突照样红，
          # 不静默覆盖。提交信息日期也用北京日期，和 daily 口径一致。
          git commit -m "tracker: 周度体检(云) $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
