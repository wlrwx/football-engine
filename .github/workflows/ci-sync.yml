# 云端同步与研究管线（2026-10-12）：把可搬迁的本地 cron 搬上 GitHub Actions
# 项目本身在 GitHub——数据/研究类任务不依赖用户的 Mac 开机。
# 浏览器会话类（NJStats 预测挑战提交）无法上云：需要登录态，保留在 Mac Air 上。
# 2026-10-13：Air 上除预测挑战外的本地 hourly cron 必须全部停掉——
# 它与本 workflow 同时写 data/state/，每小时必有一次 non-fast-forward 冲突，
# 两边互相覆盖，产物以谁最后推上为准，不可追溯。
name: Sync & Research
on:
  schedule:
    - cron: '47 * * * *'    # 每小时第47分，避开 daily-forecast(:15/:45)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-sync
  cancel-in-progress: false   # 不中途砍，防半截写坏状态文件
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt --quiet
      # 2026-10-13：删掉原来这里的「盘口监控（realtime_odds_monitor.py）」步骤。
      # 该脚本文件头自述「已弃用 2026-08-05，从未被 GitHub Actions 调度」——
      # 它在 CI 里跑的是一个空转函数，不产出任何 odds_series 数据，
      # 但步骤名让后来者以为「盘口采集在这里」。odds_series 的真实来源是
      # daily-forecast 里的 fetch_sina_odds.py（快照序列累积），归它管。
      # 每小时一次无用的仓库写入也由此减少（少一次 rebase 竞态窗口）。
      - name: SportMonks 采集（免费档/试用通用，token 门控）
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: python scripts/sportmonks_capture.py --date "$(TZ=Asia/Shanghai date +%F)" --quiet || true
      - name: NJStats（试用 2026-10-15 已到期，收割完结，步骤休眠）
        run: echo "njstats trial expired; archive 150/150 done"
      - name: 恢复 fdc 缓存
        # 原始 CSV 与解析表都不再入库（见 .gitignore），用 Actions 缓存在本机之间传递，
        # 避免每小时重复下载 43 个 CSV；缓存丢失时下面的 date 门控会自动补抓。
        uses: actions/cache@v4
        with:
          path: data/state/fdc
          key: fdc-${{ github.run_id }}
          restore-keys: |
            fdc-
      - name: 每日任务（fdc 历史刷新/AUT 纸面跟踪；date 门控）
        # DJYY 月审已移出本步骤：它读 _vault/djyy_value_model.json，而 _vault/ 被
        # .gitignore 排除（0e1447d93 的刻意安全设计，免数据口子被站点封堵）——
        # runner 上该文件不存在，以前靠 `|| true` 吞掉 FileNotFoundError，
        # 步骤名却让人以为云端在跑月审。现仅在本地手工跑：python scripts/djyy_audit.py
        run: |
          STAMP="data/state/.daily_ci_$(TZ=Asia/Shanghai date +%F)"
          # 2026-10-28：fdc 缓存不再入库（43 个 CSV + 26MB parsed.jsonl）。
          # 于是「今天已经刷过」的判断要加上「解析缓存还在不在本机」——
          # 否则换一个干净的 runner 就会跳过抓取，后面的 CLV 重算无数据可用。
          if [ ! -f "$STAMP" ] || [ ! -f data/state/fdc/parsed.jsonl ]; then
            python scripts/fetch_football_data.py >> "$STAMP" 2>&1 || true
            python scripts/paper_track_draw.py >> "$STAMP" 2>&1 || true
            touch "$STAMP"
          fi
      - name: 重算下注级 CLV（依赖上一步的 fdc 解析缓存）
        # 2026-10-28：此前没有任何 workflow 调用 clv_pinnacle.py，
        # 于是 data/state/clv_pinnacle.json 停在 2026-10-23（ok=258），
        # 新入账的注一条都没进面板，而 health-check 还在引用这个文件判断收盘通路。
        run: python scripts/clv_pinnacle.py || echo "::error::CLV 重算失败（fdc 缓存为空或解析异常）"
      # 2026-10-22：sina 赔率时序采集也挂到这里。
      #
      # 起因是 PR#9 的结论被推翻了：那次把 fetch_sina_odds 的 `--days` 从 1 扩到 2
      # 是想解决"末快照距开赛中位 9.6h、开赛前 2h 内取到价的只有 3.5%"，
      # 跑满 10 天后同一指标 3.6%→3.5%，一点没动 —— 因为它改的是窗口左端，
      # 病灶在右端的**采集次数**：抓取只挂在 daily-forecast 上，而它 24h 实际
      # 只跑 12/48 次（GitHub 对公开仓的 schedule 是随机丢弃，不是排队）。
      # 提高单条 cron 频率没有意义（*/15 实测也只跑 5 次/天），跨 workflow 冗余才有意义：
      # 这里再挂一份，等于把有效频率叠加到 ~18 次/天。
      #
      # 注意：不要因为这一步在就以为 daily-forecast 那份可以删——
      # 覆盖率报告（engine.odds_series_coverage）在 daily-forecast 里算。
      - name: sina 赔率时序采集（closing coverage）
        run: python scripts/fetch_sina_odds.py || echo "⚠ 新浪赔率抓取失败（辅助源，继续）"
      - name: 刷新 CLV 与体检报告
        run: |
          python -m engine.review.clv --quiet || true
          python -m engine.doctor --check --no-net --quiet || true
      - name: 提交回仓库
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # runner 上没有本地那份 SSH deploy key，用 workflow token 走 HTTPS
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/wlrwx/football-engine.git"
          # 先本地提交（各采集步骤留在工作区的变更），再 rebase 拉齐，最后推送
          git add data/ web/ || true
          git diff --cached --quiet || git commit -m "ci-sync: $(TZ=Asia/Shanghai date +%F\ %H:%M)"
          git pull --rebase origin main || (git rebase --abort 2>/dev/null; true)
          git push origin HEAD:main || echo "推送跳过（无新提交或竞态，下轮重试）"

