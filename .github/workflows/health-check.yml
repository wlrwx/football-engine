name: Health Check

on:
  schedule:
    # 2026-08-14：5min→15min（每天 288 次→96 次，省 Actions 分钟）。
    # daily-forecast 每 30 分钟跑一次，15 分钟探测完全来得及发现"超1小时没跑"。
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check last Daily Forecast run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取最近一次 daily-forecast workflow 的完成时间
          LAST_RUN=$(gh api repos/${{ github.repository }}/actions/workflows/daily-forecast.yml/runs \
            --jq '.workflow_runs[0] | {conclusion: .conclusion, created_at: .created_at, status: .status}')

          CONCLUSION=$(echo "$LAST_RUN" | jq -r '.conclusion // "none"')
          CREATED_AT=$(echo "$LAST_RUN" | jq -r '.created_at')
          STATUS=$(echo "$LAST_RUN" | jq -r '.status')

          echo "→ 上次 Daily Forecast: $CREATED_AT ($STATUS, $CONCLUSION)"

          # 计算距今分钟数
          CREATED_TS=$(date -d "$CREATED_AT" +%s)
          NOW_TS=$(date +%s)
          ELAPSED_MIN=$(( (NOW_TS - CREATED_TS) / 60 ))

          echo "→ 距今 ${ELAPSED_MIN} 分钟"

          if [ "$STATUS" = "in_progress" ]; then
            echo "→ Daily Forecast 正在运行中，跳过"
            exit 0
          fi

          if [ "$ELAPSED_MIN" -gt 60 ]; then
            echo "→ 超过60分钟未运行，触发 Daily Forecast..."
            # 用 gh api 触发，不需要 git checkout
            gh api repos/${{ github.repository }}/actions/workflows/daily-forecast.yml/dispatches \
              -X POST \
              -f ref=main
            echo "::notice::已自动触发 Daily Forecast（上次运行于 ${ELAPSED_MIN} 分钟前）"
          else
            echo "→ 正常运行中，无需触发"
          fi

      # 2026-10-11：赔率时序采集覆盖率告警。
      #
      # 修正：初版在这里直接跑 `python -m engine.odds_series_coverage`，
      # 但本 job **刻意不 checkout**（原注释："用 gh api 触发，不需要 git checkout"），
      # 于是该步骤以
      #     ModuleNotFoundError: No module named 'engine'
      # 失败（2026-10-11 01:33 实测）。
      #
      # 改法：覆盖率由 daily-forecast（有 checkout、且会提交 data/）计算并落盘，
      # 这里只用 gh api 读结果判断，不引入 checkout。
      - name: Odds series coverage (read-only)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="repos/${{ github.repository }}/contents/data/state/odds_coverage.json"
          CONTENT=$(gh api "$URL" --jq '.content' 2>/dev/null | base64 -d) || CONTENT=""
          if [ -z "$CONTENT" ]; then
            echo "→ 尚无覆盖率数据，跳过"
            exit 0
          fi
          echo "$CONTENT" | jq -r '
            (.closing_coverage.ratio * 1000 | round / 10) as $pct
            | "→ 开赛前 \(.closing_coverage.window_h)h 内有快照: \(.closing_coverage.n)/\(.total_matches) 场 (\($pct)% )",
              "→ 健康判定: \(if .healthy then "健康" else "不健康 —— CLV 类实验不可用" end)"
          '
          if ! echo "$CONTENT" | jq -e '.healthy' >/dev/null; then
            echo "::warning::赔率时序覆盖率低于 50% 门槛 —— CLV 类实验当前不可用"
          fi
