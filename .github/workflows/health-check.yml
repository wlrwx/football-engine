name: Health Check

on:
  schedule:
    # 2026-10-11：*/15 → 0 * * * *（每小时一次）
    #
    # 实测（2026-10-11，以 git 提交为地面真值）：
    #   本 workflow 声明 */15（96 次/天），24 小时内实际只跑了 5 次
    #   Daily Forecast 声明 15,45（48 次/天），24 小时内实际跑了 8 次，最大空档 6 小时
    #
    # 这是 GitHub 对**公开仓库高频定时任务**的排队限流（官方文档："Due to high
    # load, scheduled workflows may run with some delay"）。改成每小时后，
    # 实际频率才可能接近声明频率。
    #
    # 注意：阈值必须匹配真实频率。旧的 "超过60分钟未运行就触发" 假设 15 分钟探测，
    # 而实际 4-5 小时才跑一次 —— 那意味着 1 小时的故障它根本发现不了，
    # 60 分钟这个阈值在当时是**永不生效的死逻辑**。现在按每小时一轮设定。
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check last Daily Forecast run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取最近一次 daily-forecast workflow 的完成时间
          LAST_RUN=$(gh api repos/${{ github.repository }}/actions/workflows/daily-forecast.yml/runs \
            --jq '.workflow_runs[0] | {conclusion: .conclusion, created_at: .created_at, status: .status}')

          CONCLUSION=$(echo "$LAST_RUN" | jq -r '.conclusion // "none"')
          CREATED_AT=$(echo "$LAST_RUN" | jq -r '.created_at')
          STATUS=$(echo "$LAST_RUN" | jq -r '.status')

          echo "→ 上次 Daily Forecast: $CREATED_AT ($STATUS, $CONCLUSION)"

          # 计算距今分钟数
          CREATED_TS=$(date -d "$CREATED_AT" +%s)
          NOW_TS=$(date +%s)
          ELAPSED_MIN=$(( (NOW_TS - CREATED_TS) / 60 ))

          echo "→ 距今 ${ELAPSED_MIN} 分钟"

          if [ "$STATUS" = "in_progress" ]; then
            echo "→ Daily Forecast 正在运行中，跳过"
            exit 0
          fi

          # 阈值按"本 job 约每小时跑一轮"设定：超过 90 分钟未运行意味着
          # Daily Forecast 连一轮都没出，触发补跑。旧值 60 是在 */15 的假设下
          # 设的，实际 4-5 小时才跑一次时它永不生效。
          if [ "$ELAPSED_MIN" -gt 90 ]; then
            echo "→ 超过90分钟未运行，触发 Daily Forecast..."
            # 用 gh api 触发，不需要 git checkout
            gh api repos/${{ github.repository }}/actions/workflows/daily-forecast.yml/dispatches \
              -X POST \
              -f ref=main
            echo "::notice::已自动触发 Daily Forecast（上次运行于 ${ELAPSED_MIN} 分钟前）"
          else
            echo "→ 正常运行中，无需触发"
          fi

      # 2026-10-11：赔率时序采集覆盖率告警。
      #
      # 修正：初版在这里直接跑 `python -m engine.odds_series_coverage`，
      # 但本 job **刻意不 checkout**（原注释："用 gh api 触发，不需要 git checkout"），
      # 于是该步骤以
      #     ModuleNotFoundError: No module named 'engine'
      # 失败（2026-10-11 01:33 实测）。
      #
      # 改法：覆盖率由 daily-forecast（有 checkout、且会提交 data/）计算并落盘，
      # 这里只用 gh api 读结果判断，不引入 checkout。
      - name: Odds series coverage (read-only)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="repos/${{ github.repository }}/contents/data/state/odds_coverage.json"
          CONTENT=$(gh api "$URL" --jq '.content' 2>/dev/null | base64 -d) || CONTENT=""
          if [ -z "$CONTENT" ]; then
            echo "→ 尚无覆盖率数据，跳过"
            exit 0
          fi
          echo "$CONTENT" | jq -r '
            (.closing_coverage.ratio * 1000 | round / 10) as $pct
            | "→ 开赛前 \(.closing_coverage.window_h)h 内有快照: \(.closing_coverage.n)/\(.closing_coverage.assessable) 已开赛 (\($pct)%)",
              "→ 未开赛 \(.closing_coverage.pending_kickoff) 场不入分母；采集提前停 \(.closing_coverage.stopped_before_kickoff) 场",
              "→ 健康判定: \(if .healthy then "健康" else "不健康 —— sina 收盘通路不可用，收盘价改走 b365/平博（clv_pinnacle.json）" end)"
          '
          if ! echo "$CONTENT" | jq -e '.healthy' >/dev/null; then
            echo "::warning::赔率时序覆盖率低于 50% 门槛 —— sina 收盘通路不可用（2026-10-22 实测 3.5%，PR#9 扩窗口已证无效，瓶颈是采集频率）"
          fi

      # 2026-10-22：DJYY 被边缘拦截要在这里报警。
      #
      # 起因：djyy_prob 从 2026-08-15 起恒为 null、连续 3.5 周无人察觉；
      # 10-11 修成"失败可见"（engine/sources/djyy.py 记 blocked_by_edge），
      # 但可见性只落到 data/djyy_status.json 里，**没有任何一步去读它做判断**。
      # 状态文件没人看 = 又一种形式的静默。这里按已有模式用 gh api 读，不引入 checkout。
      - name: DJYY source health (read-only)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="repos/${{ github.repository }}/contents/data/djyy_status.json"
          CONTENT=$(gh api "$URL" --jq '.content' 2>/dev/null | base64 -d) || CONTENT=""
          if [ -z "$CONTENT" ]; then
            echo "::warning::读不到 data/djyy_status.json —— DJYY 体检从未跑过？"
            exit 0
          fi
          echo "$CONTENT" | jq -r '
            "→ DJYY 状态: \(if .healthy then "健康" else "不健康" end)"
            + " | 生成于 \(.generated_at) | 覆盖 \(.covered)/\(.fixtures)"
            + (if (.snapshot_probs // 0) > 0
               then " | 快照补位 \(.snapshot_probs)/\(.snapshot_total // "?")（龄 \(.snapshot_age_h // "?")h）"
               else "" end)
            + (if .error then "\n  原因: \(.error)" else "" end)
          '
          # 不健康 + 状态文件是新鲜的（说明这一轮真的试过且失败），才值得单独点名。
          # 2026-10-22：实时源被系统性拦截，但快照补位已接管 fusion 第三通道；
          # 只有「既被拦、又没补位」才是真故障，否则每轮都报 error = 狼来了。
          if echo "$CONTENT" | jq -e '.healthy == false and (.error // "" | test("blocked_by_edge"))' >/dev/null; then
            SNAP=$(echo "$CONTENT" | jq -r '.snapshot_probs // 0')
            if [ "$SNAP" -gt 0 ]; then
              echo "::warning::DJYY 实时源仍被边缘拦截（403），但快照补位 ${SNAP} 场生效——第三通道未死，无需人工修复"
            else
              echo "::error::DJYY 被 Cloudflare 边缘拦截（403）且无快照补位，融合里 0.2 的 djyy 权重实际贡献 0" \
                   "—— 修法见 docs/EXPERIMENTS.md「DJYY 在 CI 侧被 Cloudflare 拦截」节"
            fi
          fi

      # 2026-10-28：快照通道自身的存活探测。
      # fetch_djyy_ssr.py 现在把每次抓取结果写进 data/djyy_snapshot_status.json
      # （此前失败只有一行 stdout + workflow 里的 `|| echo ⚠`，CI 恒绿）。
      # 实时源被 403 时 fusion 第三通道全靠快照兜底；快照也抓不到 = 双通道全断，
      # 此时 djyy 权重被静默归一化掉、账本前后不可比 —— 必须红，不能 warn。
      - name: DJYY snapshot channel health (read-only)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="repos/${{ github.repository }}/contents/data/djyy_snapshot_status.json"
          SNAP=$(gh api "$URL" --jq '.content' 2>/dev/null | base64 -d) || SNAP=""
          if [ -z "$SNAP" ]; then
            echo "::warning::没有 data/djyy_snapshot_status.json —— 快照通道尚未上报过状态"
            exit 0
          fi
          echo "$SNAP" | jq -r '"→ DJYY 快照通道: "
            + (if .ok then "抓取成功" else "抓取失败(\(.reason))" end)
            + " | 于 \(.at) | 场次 \(.matches // 0)（含赔率 \(.with_odds // 0)）"
            + " | 盘上快照龄 \(.snapshot_age_h // "?")h"'
          AGE_H=$(echo "$SNAP" | jq -r 'if .at_epoch then ((now - .at_epoch) / 3600 | floor) else -1 end')
          if [ "$AGE_H" != "-1" ] && [ "$AGE_H" -gt 30 ]; then
            echo "::error::DJYY 快照状态已 ${AGE_H}h 未更新（阈值 30h）—— fetch_djyy_ssr 步骤可能根本没跑（workflow 被禁用/定时丢失），双通道无人值守"
          fi
          # 2026-10-28：ok=false **不等于**通道死。这份状态文件被 CI 与本机 duty
          # 交替覆盖，而 CI 侧被 Cloudflare 拦是常态 → 每次 CI 写入都是 ok=false。
          # 真正的判据是盘上快照的年龄（下面是 error）；这里只记录本次尝试结果。
          if [ "$(echo "$SNAP" | jq -r '.ok')" != "true" ]; then
            echo "::warning::最近一次抓取失败（$(echo "$SNAP" | jq -r '.reason')，写入方 $(echo "$SNAP" | jq -r '.source // "?"')）——CI 侧被拦属预期，看盘上快照龄判定是否双通道全断"
          fi
          if echo "$SNAP" | jq -e '.snapshot_age_h == null or .snapshot_age_h > 24' >/dev/null; then
            echo "::error::DJYY 快照已 $(echo "$SNAP" | jq -r '.snapshot_age_h // "无快照"')h 未更新（阈值 24h）—— 本机 duty 可能长期离线，实时源一旦被拦就没有兜底"
          fi

      # 2026-10-28：football-data.co.uk 缓存新鲜度。
      # 起因：缓存从 2026-10-09 起停更 19 天，CLV 面板停在 10-08，而新入账的
      # 272 注全部匹配失败却只被记成 league_uncovered/no_en/no_match —— 看不出
      # 「根本没新数据」。根因有两个：抓取脚本「文件存在就跳过」+ 代理写死在本机
      # Clash，CI 里必然失败且被 `|| true` 吞掉。两边都修了，这里补判定。
      - name: football-data cache freshness (read-only)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="repos/${{ github.repository }}/contents/data/state/fdc/status.json"
          ST=$(gh api "$URL" --jq '.content' 2>/dev/null | base64 -d) || ST=""
          if [ -z "$ST" ]; then
            echo "::warning::没有 data/state/fdc/status.json —— 抓取脚本尚未上报过状态"
            exit 0
          fi
          echo "$ST" | jq -r '"→ football-data: 刷新 \(.files_ok)/\(.files_total) | 最新数据 \(.latest_date // "?")'
            + " | 行数 \(.rows) | " + (if .proxy_configured then "代理已配置" else "直连" end)'
          if [ "$(echo "$ST" | jq -r '.files_ok')" = "0" ]; then
            echo "::error::football-data 全部文件刷新失败 —— CLV 面板会停在旧数据上（检查出口网络或 FDC_PROXY）"
          fi
          if echo "$ST" | jq -e '(.latest_date != null) and ((now - (.latest_date + "T00:00:00Z" | fromdateiso8601)) > 8*86400)' >/dev/null; then
            echo "::error::football-data 最新数据只到 $(echo "$ST" | jq -r '.latest_date')（超过 8 天）—— 缓存未刷新，CLV 覆盖率会持续下滑"
          fi
