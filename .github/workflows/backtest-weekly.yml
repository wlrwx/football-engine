name: Weekly Backtest

on:
  schedule:
    # 每周一北京时间 03:00 = UTC 周日 19:00
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 2026-08-14：与 daily-forecast 拆分 group——此前共用 sporttery-engine，
  # 周回测（最长 30min）会阻塞每 30 分钟一次的实时预报结算。
  group: sporttery-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Run backtest + parameter optimization
        run: python -m engine.backtest.weekly_run

      - name: Evaluate champion/challenger
        run: python -m engine.learning.weekly_evaluate

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ config/
          git diff --cached --quiet || git commit -m "backtest: weekly optimization $(date +%Y-%m-%d)"
          # 2026-10-23：先 rebase 再 push。原来裸 push，一旦远端有人动过
          # （本地 Mac 同步 / 另一条流水线）就是 non-fast-forward，周报产物
          # 静默丢失且 job 只是红一下看不出原因。rebase 冲突时让步骤失败，
          # 数据留在 workspace 里可查。
          git pull --rebase origin main
          git push origin HEAD:main
