# 外部 PR 闸门：自动化身份不得碰裁判层；人的改动需要 human-approved 标签；
# 挑战子系统改动必须写「拔除影响评估」。判定逻辑全在 scripts/pr_guard.py（有单测）。
# 注意：这是三道闸的第一道。真正让「小号合不了 PR」的是 main 的 ruleset
# （必须 PR + 1 个别人批准 + 必过检查），两者缺一不可。
name: PR 闸门
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 三点 diff 需要 merge-base，浅克隆取不到共同祖先
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: 取改动清单
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q origin "$BASE_SHA" "$HEAD_SHA" || git fetch -q origin
          # 2026-11-04：必须用三点 diff（merge-base..head），与 GitHub 的 Files changed 一致。
          # 原来用两点 `base head`，当 fork 落后于 main 时，会把「上游比 fork 多出来的改动」
          # 反向算成 PR 的改动——PR #80 只加了 1 个新文件，却被判成改了 review_ledger.jsonl
          # 与 duty 快照而拦红。那是误报，且会冤拦几乎所有落后于 main 的 fork PR。
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed.txt
          echo "改动 $(wc -l < /tmp/changed.txt) 个文件"
          cat /tmp/changed.txt
      - name: 判定
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          python scripts/pr_guard.py --files-from /tmp/changed.txt \
            --labels-json "$PR_LABELS" --body-file /tmp/pr_body.txt --author "$PR_AUTHOR"
