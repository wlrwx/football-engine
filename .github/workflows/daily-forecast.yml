name: Daily Forecast

on:
  schedule:
    # 每30分钟，每次跑都顺便结算昨天（幂等，已结算过会跳过）
    - cron: '15,45 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD)'
        required: false
        default: ''
      settle_only:
        description: '仅结算指定日期（YYYY-MM-DD），跳过预测'
        required: false
        default: ''
      backfill_days:
        description: '结算回溯天数（默认4天）'
        required: false
        default: '4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sporttery-engine
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Sync with remote (avoid build-time conflicts)
        # 2026-08-07 修复：build 前先同步远端。否则 build 产物与远端
        # 提交在 commit 后 pull --rebase 时冲突，冲突标记会写进 web/*.html
        # （8/7 Pages 页面出现 <<<<<<< HEAD 的根因）。
        run: |
          git pull --rebase origin main || echo "⚠ 同步失败（继续，commit 步骤有冲突检测兜底）"
          # 防御：若上一步 rebase 失败残留冲突标记，立即清理重建
          if grep -rl '<<<<<<< HEAD' web/ data/ 2>/dev/null | grep -q .; then
            echo "⚠ 检测到冲突标记残留，强制恢复远端版本"
            git checkout --theirs -- web/ data/ 2>/dev/null || true
            git checkout -- web/ data/ 2>/dev/null || true
          fi

      - name: Fetch DJYY SSR odds
        run: |
          python scripts/fetch_djyy_ssr.py || echo "⚠ DJYY SSR 抓取失败（辅助数据源，继续）"

      - name: Fetch Sina results + odds
        run: |
          python scripts/fetch_sina_results.py || echo "⚠ 新浪赛果抓取失败（继续，结算时再补抓）"
          python scripts/fetch_sina_odds.py || echo "⚠ 新浪赔率抓取失败（辅助数据源，继续）"

      # 2026-10-11：赔率时序采集覆盖率体检（health-check 用 gh api 读这个结果）
      - name: Odds series coverage
        run: python -m engine.odds_series_coverage

      - name: Settlement only (manual trigger)
        if: ${{ github.event.inputs.settle_only != '' }}
        env:
          SPORTTERY_PROXY: ${{ secrets.SPORTTERY_PROXY }}
        run: |
          echo "→ 仅结算模式: ${{ github.event.inputs.settle_only }}"
          python scripts/fetch_sina_results.py --date "${{ github.event.inputs.settle_only }}" || echo "  ⚠ 新浪赛果刷新失败"
          python -m engine.main --settle --date "${{ github.event.inputs.settle_only }}"
          python engine/build_site.py

      - name: Run daily forecast
        if: ${{ github.event.inputs.settle_only == '' }}
        env:
          SPORTTERY_PROXY: ${{ secrets.SPORTTERY_PROXY }}
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            # 竞彩使用北京时间，GitHub Actions 默认 UTC
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi
          python -m engine.main --date "$DATE"

      - name: Settlement (last N days, idempotent)
        if: ${{ github.event.inputs.settle_only == '' }}
        env:
          SPORTTERY_PROXY: ${{ secrets.SPORTTERY_PROXY }}
        run: |
          # 每次运行都结算最近 N 天（默认4天）：先刷新该日新浪赛果（幂等合并），再结算。
          # 引擎侧幂等：已结算场次自动跳过（Elo/熔断/权重不重复更新），
          # review.json 每次都会重新生成，因此复盘不会被"已存在即跳过"冻结。
          BACKFILL_DAYS="${{ github.event.inputs.backfill_days || '4' }}"
          for DAYS_BACK in $(seq 1 "$BACKFILL_DAYS"); do
            D=$(TZ=Asia/Shanghai date -d "$DAYS_BACK days ago" +%Y-%m-%d)
            echo "→ [结算] $D (${DAYS_BACK} 天前)"
            python scripts/fetch_sina_results.py --date "$D" || echo "  ⚠ 新浪赛果刷新失败: $D"
            # 2026-08-05 修复：结算失败必须让 workflow 红色失败，绝不被 || echo 吞掉。
            # 教训：8/5 09:41 结算 8/3/8/4 静默失败（_src_hit 缺参抛异常被兜底掩盖），
            #       页面绿但数据没更新。fetch 失败可容忍（幂等下次补抓），结算失败=系统 bug 必须暴露。
            python -m engine.main --settle --date "$D" || { echo "::error::结算失败: $D（系统 bug，必须修复）"; exit 1; }
          done

      - name: Settle parlays (真实串票逐腿结算)
        # 2026-08-10：串关/波胆复盘闭环进 Actions。ticket_plan 真实出票
        # 用 results.json 逐腿结算 → data/state/parlay_settle.json（幂等，
        # pending 票等赛果出来后下次运行自动补结算）。
        run: |
          python -m engine.review.settle_parlays || echo "⚠ 串票结算失败（继续，build 用旧数据）"

      - name: Data integrity selfcheck (防静默数据断裂)
        # 2026-08-13 新增：盘口字段 207 场 0% 抓取率三周无人发现（字段名不匹配
        # 静默死亡）→ 每次预测/结算后自动检查。告警写 selfcheck_report.json
        # 并随 Commit 提交，历史留痕。
        # 2026-08-14 起：目标日关键字段全缺时用 --fail-on-critical 阻断（退出码 2），
        # 不再被 || true 吞掉；历史全量扫描仍保留为非阻塞报告。
        run: |
          python -m engine.selfcheck --all || true
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi
          # 2026-08-16 修复：python -m 模块方式（sys.path[0]=仓库根），
          # 直接 python engine/selfcheck.py 时 import engine 包失败（ModuleNotFoundError）
          python -m engine.selfcheck --date "$DATE" --fail-on-critical
          # 若存在盘口全缺的严重告警，标记为 workflow annotation
          python - <<'EOF'
          import json
          try:
              r = json.load(open('data/state/selfcheck_report.json'))
              severe = [a for a in r.get('alerts', []) if '全缺' in a and any(k in a for k in ('crs_odds','ttg_odds','hafu_odds'))]
              if severe:
                  print(f"::warning::数据完整性严重告警 {len(severe)} 条: " + " | ".join(severe[:3]))
          except Exception:
              pass
          EOF

      # 2026-10-11：刷新评估类报告。
      #
      # 此前 upgrade_tracker / edge_calibration / config_audit **没有任何 workflow
      # 调用**，全是人工跑一次提交到仓库，然后就永远不再更新。实测后果：
      #   upgrade_tracker.json 在 main 上仍是 PR#6 之前的旧 schema
      #     → 网页至今显示旧的误导性「进化生效」，而修复后的 Q1/Q2 拆分从未生效
      #   edge_calibration.json 陈旧 11 天
      #
      # 三个生成器都在 2 秒内，放进 30 分钟的 job 无负担。
      # 耗时实验类（historical_replay / gate_test / residual_market，15-40 分钟）
      # **不放这里**，应由 backtest-weekly 或手动触发。
      - name: Refresh evaluation reports
        run: |
          python scripts/upgrade_tracker.py || echo "::warning::upgrade_tracker 失败（网页判定将停留在旧值）"
          python scripts/edge_calibration.py || echo "::warning::edge_calibration 失败"
          python -m engine.config_audit --strict || echo "::warning::config 审计失败"

      - name: Build site
        run: python engine/build_site.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 2026-08-07 修复：commit 前强制检测冲突标记——任何数据/网页文件
          # 含 <<<<<<< HEAD 一律中止提交（宁可这次不推送，绝不污染线上）。
          # 根因：pull --rebase 冲突会把冲突标记写进构建产物，曾被 push 到
          # Pages 展示（8/7 六张卡片出现 <<<<<<< HEAD）。
          if grep -rl '<<<<<<< HEAD' web/ data/ 2>/dev/null | grep -q .; then
            echo "::error::检测到冲突标记残留（web/ 或 data/），中止提交，避免污染线上"
            exit 1
          fi
          git add data/ web/
          git diff --cached --quiet || git commit -m "daily: forecast $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
          # 兜底：rebase 若产生冲突标记（理论已由上面检测拦截），再次检测
          if grep -rl '<<<<<<< HEAD' web/ data/ 2>/dev/null | grep -q .; then
            echo "::error::push 后仍检测到冲突标记残留，请人工检查"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
